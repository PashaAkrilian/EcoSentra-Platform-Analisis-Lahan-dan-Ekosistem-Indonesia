name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, staging, main]

# Batalkan run lama di branch/PR yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build TIDAK membutuhkan kredensial Firebase/Anthropic: aplikasi dibangun
      # dalam mode demo (Firebase Admin diinisialisasi malas, saat dibutuhkan).
      - name: Build
        run: npm run build

      # Hanya gagal untuk kerentanan KRITIS pada dependency produksi; temuan lain
      # dipantau lewat Dependabot (sebagian berada di dependency transitif yang
      # belum punya perbaikan upstream).
      - name: Audit dependency produksi
        run: npm audit --omit=dev --audit-level=critical

  web-emulator:
    name: Web — integrasi Firebase Emulator (Admin SDK asli)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Emulator Firestore berjalan di JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache binary emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # Menjalankan emulator Auth + Firestore (dengan firestore.rules repo), mengeksekusi uji,
      # lalu mematikannya. Memverifikasi token, kepemilikan data, kaskade hapus, claim admin,
      # hapus akun, dan bahwa aturan menolak akses klien langsung.
      # Memakai firebase.emulators.json (bukan firebase.json): blok hosting.source di sana
      # membuat firebase-tools mencoba membangun Next.js setiap emulator dijalankan.
      - name: Uji integrasi
        run: >
          npx --yes firebase-tools@15 emulators:exec --config firebase.emulators.json
          --only auth,firestore --project demo-ecosentra
          "FIREBASE_PROJECT_ID=demo-ecosentra npm run test:emulator --prefix apps/web"

  geo:
    name: services/geo — ruff & pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/geo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/geo/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  mcp:
    name: services/mcp — ruff & pytest (termasuk uji protokol stdio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mcp/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    name: Docker — build image services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [geo, mcp]
    steps:
      - uses: actions/checkout@v7
      - name: Build services/${{ matrix.service }}
        run: docker build --tag ecosentra-${{ matrix.service }}:ci services/${{ matrix.service }}
